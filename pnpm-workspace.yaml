packages: []

# ExaDev's own published packages: the minimumReleaseAge gate exists to guard against a compromised third-party maintainer publishing a malicious version before the wider community catches it. That threat model doesn't apply to a package this org publishes itself, since the release pipeline and the change are already reviewed. Excluded by bare name, not a pinned version, so every future release stays covered without editing this file again.
minimumReleaseAgeExclude:
  - '@exadev/eslint-config'
